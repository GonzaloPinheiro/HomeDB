name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore
        run: dotnet restore HomeDB.slnx

      - name: Build
        run: dotnet build HomeDB.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test HomeDB.slnx --no-build --configuration Release
